[project]
name = "commit-comment-generate-cli"
version = "0.1.0"
description = "ステージング済みの変更から日本語コミットメッセージを自動生成する CLI ツール"
readme = "README.md"
authors = [
    { name = "takagi", email = "shiroka1125@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "langchain>=1.2.17",
    "langchain-google-genai>=4.2.2",
    "typer>=0.25.1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
ccg = "commit_comment_generate_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_comment_generate_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
